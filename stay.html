<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stay & Roam | PolySoko Stays</title>
<link rel="shortcut icon" href="./favicon.ico" />
<link rel="stylesheet" href="./style.css?v=13" />
<script src="./dialogs.js?v=1" defer></script>
<script src="./api.js?v=13" defer></script>
<script src="./stay.js?v=2" defer></script>
<style>
.stay-wrap{max-width:1100px;margin:0 auto;padding:86px 16px 60px;color:#e6edf3;}
.stay-topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(7,11,16,.92);border-bottom:1px solid #1b2530;}
.stay-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:900;margin-right:auto;}
.stay-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#00ff88,#00c96b);color:#04120a;border-radius:999px;padding:8px 14px;font-weight:900;text-decoration:none;flex:0 0 auto;white-space:nowrap;}
.stay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px;}
.stay-card{background:#10161d;border:1px solid #223041;border-radius:16px;overflow:hidden;}
.stay-card img{width:100%;height:190px;object-fit:cover;display:block;background:#0a0f14;}
.stay-body{padding:14px;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pillx{font-size:.72rem;background:#182633;border:1px solid #2b3d52;color:#cfe3ff;border-radius:999px;padding:4px 10px;}
.stay-filters{display:grid;grid-template-columns:1fr 140px 160px;gap:10px;margin-top:14px;}
.stay-filters input,.stay-filters select{background:#000;border:1px solid #2b3d52;color:#fff;border-radius:10px;padding:12px;}
.stay-btn{background:linear-gradient(135deg,#00ff88,#00c96b);border:none;border-radius:10px;padding:12px 14px;font-weight:900;cursor:pointer;color:#04120a;width:100%;margin-top:10px;}
.stay-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.stay-modal.open{display:flex;}
.stay-sheet{width:min(560px,100%);background:#121922;border:1px solid #2b3d52;border-radius:16px;padding:18px;max-height:88vh;overflow:auto;}
.stay-sheet input{width:100%;background:#000;border:1px solid #2b3d52;color:#fff;border-radius:10px;padding:12px;margin-top:8px;box-sizing:border-box;}
.stay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sr-carousel{position:relative;border-radius:12px;overflow:hidden;background:#0a0f14;}
.sr-track{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.sr-track::-webkit-scrollbar{display:none;}
.sr-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;}
.sr-slide img{width:100%;height:230px;object-fit:cover;display:block;}
.sr-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:1px solid #2b3d52;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1;}
.sr-prev{left:8px;} .sr-next{right:8px;}
.sr-dots{display:flex;gap:6px;justify-content:center;padding:8px 0 2px;}
.sr-dot{width:7px;height:7px;border-radius:50%;background:#33506b;border:none;padding:0;cursor:pointer;}
.sr-dot.on{background:#00ff88;}
.sr-count{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;border-radius:999px;padding:3px 9px;}
.sr-booked{display:inline-block;background:#3a1214;color:#ff8080;border:1px solid #5a1e22;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:800;margin-top:10px;}
.sr-avail{display:inline-block;background:#0c2b1a;color:#00ff88;border:1px solid #14532d;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:800;margin-top:10px;}
.sr-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:200;padding:12px;}
.sr-lightbox.open{display:flex;}
.sr-lightbox img{max-width:94vw;max-height:86vh;border-radius:12px;object-fit:contain;}
@media (max-width:640px){.stay-filters{grid-template-columns:1fr;}.stay-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="stay-topbar">
<a class="stay-brand" href="./index.html"><img src="./logo-mark.png" alt="PolySoko" style="width:30px;height:30px;border-radius:8px;" /> POLYSOKO</a>
<a class="stay-badge" href="./stay.html">Stay &amp; Roam</a>
</div>
<main class="stay-wrap">
<h1 style="margin:0;">Stay &amp; Roam</h1>
<p style="color:#8b98a5;margin:6px 0 0;">Handpicked short stays across Kenya. No account needed.</p>
<div class="stay-filters">
<input id="staySearch" placeholder="Search location or title e.g. Nyali..." />
<select id="stayGuests"><option value="">Any guests</option><option value="2">2+ guests</option><option value="4">4+ guests</option><option value="6">6+ guests</option></select>
<select id="staySort"><option value="new">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
</div>
<div id="stayGrid" class="stay-grid"><p style="color:#8b98a5;">Loading stays...</p></div>
</main>
<div id="stayModal" class="stay-modal"><div class="stay-sheet">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
<h2 id="stayModalTitle" style="margin:0;font-size:1.15rem;">Book stay</h2>
<button onclick="closeStayModal()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;">X</button>
</div>
<div id="stayModalBody"></div>
</div></div>
<div id="srLightbox" class="sr-lightbox" onclick="if(event.target.id==='srLightbox'||event.target.id==='srLightImg')closeSrLightbox()"><img id="srLightImg" src="" alt="Property photo" /></div>
</body>
</html>
