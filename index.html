<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.socket.io;
        connect-src 'self' https://ipapi.co https://*.ipapi.co https://api.polysoko.online https://polysoko.online https://www.polysoko.online https://cdn.socket.io https://api.weatherapi.com https://nominatim.openstreetmap.org ws: wss:;
        frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
        media-src 'self' data: blob: https:;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        font-src 'self' https://cdnjs.cloudflare.com;
        img-src 'self' data: https:;
    ">

    <title>PolySoko | Predictions</title>
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#070b10" />
    <meta property="og:site_name" content="PolySoko" />
    <meta property="og:title" content="PolySoko" />
    <meta property="og:image" content="https://polysoko.online/icon-512.png" />

    <link rel="stylesheet" href="./style.css?v=20" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <script>
        // Load socket.io client differently when served from GitHub Pages
        (function(){
            try {
                var host = window.location.hostname || '';
                var isProd = host.includes('github.io') || (host !== 'localhost' && host !== '127.0.0.1');
                var s = document.createElement('script');
                if (isProd) {
                    s.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
                } else {
                    s.src = '/socket.io/socket.io.js';
                }
                s.defer = false;
                document.head.appendChild(s);
            } catch (e) { console.warn('Socket loader failed', e); }
        })();
    </script>
    
    <script src="./dialogs.js?v=1" defer></script>
    <script src="./api.js?v=15" defer></script>
    <script src="./ui.js?v=31" defer></script>
    <script src="./app.js?v=25" defer></script>
    <script src="./pwa.js?v=14" defer></script>

</head>

<body>

<!-- HEADER -->
<header class="mobile-header">
    <div class="header-left" style="display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;flex:1 1 auto;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div class="logo"><img src="./logo-mark.png" class="brand-mark" alt="PolySoko logo"><span>PolySoko</span></div>
        <a href="./stay.html" class="stay-brand-pill" title="Stay & Roam — vacation rentals" aria-label="Stay and Roam vacation rentals" style="display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;background:linear-gradient(135deg,#00ff88,#00c96b);color:#04120a;font-weight:900;font-size:.72rem;letter-spacing:.01em;border-radius:999px;padding:7px 11px;text-decoration:none;overflow:hidden;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
            Stay &amp; Roam
        </a>
    </div>
    <button class="profile-trigger" id="profileBtn">
        <img id="headerAvatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="header-avatar" alt="" style="background: #222;">
        👤 <span id="userNameHeader">User</span>
    </button>
</header>

<!-- MODULES -->
<div id="sidebar-placeholder"></div>
<div id="profile-placeholder"></div>
<div id="history-placeholder"></div>

<!-- ENHANCED MARKET MODAL -->
<div id="richModal" class="modal-overlay modal-rich" style="display:none;" onclick="if(event.target.id === 'richModal') closeMarket()">
    <div class="modal-container">
        <div class="modal-header-bar">
            <div class="modal-header-title">📊 Market Details</div>
            <button class="modal-close-btn" onclick="closeMarket()" title="Close">✕</button>
        </div>
        <div id="modalBody" class="modal-body-content"></div>
    </div>
</div>
<!-- MAIN APP -->
 <main class="dashboard-main">

<div class="top-dashboard-row">

    <div class="greeting-wrapper">
        <h1 id="greetingText" class="greeting-text"></h1>
        <p id="greetingMeta" class="greeting-meta"></p>
    </div>

</div>

    <!-- TRENDING -->
    <div class="section-row" id="featuredMarketsHeading">
        <span class="section-title">CHECK OUT 📈</span>
    </div>

    <div id="ongoing" class="trending-horizontal-scroll"></div>

    <!-- CATEGORY FILTER -->
    <div class="category-filter-row" id="categoryFilterRow" aria-label="Market categories">
        <button class="pill active" data-cat="all" onclick="setCategory('all')"><span class="category-icon" aria-hidden="true">▦</span><span>All</span></button>
        <button class="pill" data-cat="sports" onclick="setCategory('sports')"><span class="category-icon" aria-hidden="true">⚽</span><span>Sports</span></button>
        <button class="pill" data-cat="crypto" onclick="setCategory('crypto')"><span class="category-icon" aria-hidden="true">₿</span><span>Crypto</span></button>
        <button class="pill" data-cat="politics" onclick="setCategory('politics')"><span class="category-icon" aria-hidden="true">⚖</span><span>Politics</span></button>
        <button class="pill" data-cat="movies" onclick="setCategory('movies')"><span class="category-icon" aria-hidden="true">▣</span><span>Movies</span></button>
        <button class="pill" data-cat="news" onclick="setCategory('news')"><span class="category-icon" aria-hidden="true">▤</span><span>News</span></button>
        <button class="pill" data-cat="gaming" onclick="setCategory('gaming')"><span class="category-icon" aria-hidden="true">◈</span><span>Gaming</span></button>
        <button class="pill" data-cat="weather" onclick="setCategory('weather')"><span class="category-icon" aria-hidden="true">☼</span><span>Weather</span></button>
        <button class="pill" data-cat="tech" onclick="setCategory('tech')"><span class="category-icon" aria-hidden="true">⌘</span><span>Tech</span></button>
    </div>
    <!-- MARKETS -->
    <div class="section-row">
        <span class="section-title" id="marketSectionTitle">ALL MARKETS</span>
    </div>

    <div id="marketsList" class="markets-vertical-stack"></div>


    <div id="bet-modal" 
     onclick="window.handleOutsideClick(event)" 
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    
    <div id="modal-content" 
         onclick="event.stopPropagation()" 
         style="background:#1a1b22; width:90%; max-width:350px; padding:25px; border-radius:16px; border:1px solid #333; text-align:center;">
        
        <h2 style="color:#00ff88; margin-bottom:10px;">Confirm Your Bet</h2>
        <p id="modal-market-title" style="color:white; font-weight:bold;"></p>
        <p id="modal-pick-display" style="color:#aaa; font-size:0.9rem; margin-bottom:20px;"></p>

        <div style="margin-bottom:20px; text-align:left;">
            <label style="color:#888; font-size:0.8rem;">STAKE (KES)</label>
            <input type="number" id="bet-amount-input" value="10"
                style="width:100%; padding:15px; background:#000; border:1px solid #444; border-radius:8px; color:white; font-size:1.2rem; text-align:center;">
        </div>

        <div style="display:flex; gap:12px;">
            <button onclick="window.closeBetModal()" style="flex:1; padding:12px; background:#333; color:white; border:none; border-radius:8px; cursor:pointer;">Go Back</button>
            <button id="confirm-proceed-btn" onclick="window.processConfirmedBet()" style="flex:1; padding:12px; background:#00ff88; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Proceed</button>
        </div>
    </div>
</div>
<div id="withdrawModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Withdraw Funds</h3>
            <button onclick="toggleWithdrawModal()" class="close-btn">✕</button>
        </div>
        <div class="modal-body">
            <p style="color: gray; font-size: 0.8rem;">Minimum withdrawal: 100 sKES</p>
            <input type="number" id="withdrawAmount" placeholder="Enter amount" class="premium-input">
            <button onclick="handleWithdrawSubmit(event)" class="premium-action-btn">
                Request Withdrawal
            </button>
        </div>
    </div>
</div>
</main>
<main id="utilityView" class="utility-view" hidden aria-live="polite">
    <div class="utility-shell">
        <header class="utility-header">
            <button type="button" class="utility-back" onclick="window.closeUtilityPage()">← Home</button>
            <h1 id="utilityTitle">Account</h1>
        </header>
        <div id="utilityContent" class="utility-content"></div>
    </div>
</main>
<main id="matchView" class="match-detail-view" hidden aria-live="polite"></main>
<main id="sportView" class="sport-detail-view" hidden aria-live="polite"></main>
<nav class="mobile-bottom-nav" aria-label="Main navigation">
    <button type="button" class="active" data-mobile-nav="home" aria-current="page" onclick="window.goToAppHome?.()" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </button>
    <button type="button" data-mobile-nav="betslip" onclick="window.openSportsBetslip?.()" aria-label="Open sports betslip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><span>Betslip <b id="sportsBetslipCount">0</b></span>
    </button>
    <button type="button" data-mobile-nav="profile" onclick="window.openAppProfile?.()" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span>
    </button>
    <button type="button" data-mobile-nav="chat" onclick="window.openAppChat?.()" aria-label="Ask PolySoko AI">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg><span>Ask AI</span>
    </button>
</nav>
</body>
</html>
