<!-- OVERLAY (REQUIRED) -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(true)"></div>

<!-- SIDEBAR WRAPPER (IMPORTANT) -->
<aside id="sidebar" class="sidebar">

    <!-- INNER CONTENT (this is what app.js listens to) -->
    <div id="mainSidebar" class="sidebar-content">

        <!-- MARKETS -->
        <div class="section-label">Explore markets</div>

        <div class="sidebar-buttons">
            <button class="tab-btn active" data-cat="all"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>All markets</span></button>
            <button class="tab-btn" data-cat="sports"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m12 7 3 2-1 4h-4L9 9zm-3 2-3 1m3 3-2 4m7-4 3 4m-1-9 3-2"/></svg><span>Sports</span></button>
            <button class="tab-btn" data-cat="crypto"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 8h4a2 2 0 0 1 0 4H9zm0 4h5a2 2 0 0 1 0 4H9m2-10v2m2-2v2m-2 8v2m2-2v2"/></svg><span>Crypto</span></button>
            <button class="tab-btn" data-cat="news"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h15v16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 8h4v4H7zm7 0h4m-4 3h4m-11 4h11m-11 2h11"/></svg><span>News</span></button>
            <button class="tab-btn" data-cat="celebrities"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Celebrities</span></button>
            <button class="tab-btn" data-cat="politics"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-7 0h14M5 8h14M7 8l-3 6h6zm10 0-3 6h6zM9 4h6"/></svg><span>Politics</span></button>
            <button class="tab-btn" data-cat="tech"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></svg><span>Technology</span></button>
        </div>

        <div class="section-divider"></div>

        <!-- ACCOUNT -->
        <div class="section-label">Account &amp; activity</div>

        <div class="sidebar-buttons">
            <button class="sidebar-btn" id="myProfileBtn"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>My profile</span></button>
            <button class="sidebar-btn" onclick="window.openWalletModal?.()"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2M6 6V4a1 1 0 0 1 1-1h11"/></svg><span>Wallet &amp; payments</span></button>
            <button class="sidebar-btn" onclick="window.openHistory?.()"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2m5-2h-3"/></svg><span>Bet &amp; payment history</span></button>
            <button class="sidebar-btn" onclick="window.toggleNotificationCenter?.()"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/></svg><span>Notifications</span></button>
            <button class="sidebar-btn" onclick="window.location.hash='#chat'"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg><span>PolySoko AI chat</span></button>
            <button class="sidebar-btn" id="logoutBtn"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Log out</span></button>
        </div>

        <div class="section-divider"></div>

        <!-- STAYS -->
        <div class="section-label">Stay &amp; Roam</div>

        <div class="sidebar-buttons">
            <button class="sidebar-btn" onclick="window.location.href='stay.html'"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9m-8 12v-6h4v6"/></svg><span>Browse stays</span></button>
        </div>

    </div>
</aside>
