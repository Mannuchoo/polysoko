<div id="accountCenter" class="account-container" onclick="handleOutsideClick(event)">
    
    <div class="account-card" onclick="event.stopPropagation()">

        <!-- PROFILE HEADER -->
        <div class="profile-header">

          <div class="avatar-wrapper">

    <img id="userAvatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="avatar-img" alt="Profile picture" title="Open profile picture" tabindex="0">

    <!-- EDIT BUTTON -->
    <label for="avatarInput" class="avatar-edit" title="Change profile picture" aria-label="Change profile picture">Edit</label>
    <input type="file" id="avatarInput" accept="image/*" hidden>

    <!-- ACTION BUTTONS (hidden until image selected) -->
    <div class="avatar-actions" id="avatarActions">
        <button id="saveAvatarBtn" class="save-btn">Save</button>
        <button id="cancelAvatarBtn" class="cancel-btn">Cancel</button>
    </div>

</div>

            <div style="display:flex; align-items:center; gap:8px;">
                <h2 id="userName">User</h2>
                <div id="adminBadgePlaceholder"></div>
            </div>

            <!-- PHONE (LOCKED) -->
            <p class="profile-field">
                <span id="userPhoneDisplay">---</span>
            </p>

            <!-- EMAIL (EDITABLE) -->
            <p class="profile-field">
                <span id="userEmailDisplay">Add email</span>
            </p>

            <span id="roleBadge" class="badge">USER</span>
        </div>

        <!-- UPGRADE FEATURE (Replaced Balance Section) -->
        <div id="upgradeArea"></div>

      <!-- ACTIONS in profile html -->
<div class="account-actions" id="userActionsArea">
    <button class="action-btn" onclick="triggerDeposit()">Deposit</button>
    <button class="action-btn" onclick="toggleWithdrawModal()">Withdraw</button>
</div>

        <!-- NAME + EMAIL EDIT -->
        <div class="profile-edit-section" id="profileEditSection" style="display:block;">
            <label style="color:#888; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Display Name</label>
            <input type="text" id="editName" placeholder="Your name" style="padding:10px; border-radius:8px; border:1px solid #3f3f46; background:#0b0c10; color:white; font-size:0.9rem;">

            <label style="color:#888; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:8px;">Email Address</label>
            <input type="email" id="editEmail" placeholder="Add or update email" style="padding:10px; border-radius:8px; border:1px solid #3f3f46; background:#0b0c10; color:white; font-size:0.9rem;">

            <button id="saveProfileBtn" class="save-profile-btn" onclick="handleProfileUpdate()" style="width:100%; padding:12px; border-radius:10px; background:linear-gradient(135deg,#00ff88,#00c96b); color:black; border:none; font-weight:800; cursor:pointer; margin-top:10px;">
                Save Changes
            </button>
            <div id="profileUpdateStatus" style="font-size:0.75rem; text-align:center; margin-top:6px; min-height:1.2rem;"></div>
        </div>

        <!-- CLOSE -->
        <p class="close-account" onclick="toggleAccountCenter()">Close</p>

    </div>
</div>

<script>
window.handleProfileUpdate = async function() {
    const btn = document.getElementById('saveProfileBtn');
    const nameInput = document.getElementById('editName');
    const emailInput = document.getElementById('editEmail');
    const statusEl = document.getElementById('profileUpdateStatus');
    const name = (nameInput?.value || '').trim();
    const email = (emailInput?.value || '').trim();

    if (!name && !email) {
        statusEl.style.color = '#ff4444';
        statusEl.textContent = 'Enter a name or email to update.';
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.7';
    }

    statusEl.style.color = '#888';
    statusEl.textContent = 'Saving...';

    try {
        let nameResult = null;
        let emailResult = null;

        if (name) {
            nameResult = await apiFetch('user/update', { method: 'POST', body: { name } });
        }
        if (email && email.includes('@')) {
            emailResult = await apiFetch('user/update-email', { method: 'POST', body: { email } });
        }

        const success = (nameResult && nameResult.success) || (emailResult && emailResult.success);
        if (success) {
            statusEl.style.color = '#00ff88';
            statusEl.textContent = 'Profile updated!';
            if (typeof fetchProfile === 'function') fetchProfile();
        } else {
            const msg = nameResult?.message || emailResult?.message || 'Update failed';
            statusEl.style.color = '#ff4444';
            statusEl.textContent = msg;
        }
    } catch (e) {
        statusEl.style.color = '#ff4444';
        statusEl.textContent = 'Network error. Try again.';
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    }
};
</script>
